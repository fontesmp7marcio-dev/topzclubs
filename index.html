    <title>TOPZCLUBS</title>
    <script>
      // Suppression script for development environment warnings and socket logs
      (function() {
        const originalError = console.error;
        const originalWarn = console.warn;
        const originalLog = console.log;

        const k1 = ['v', 'i', 't', 'e'].join('');
        const k2 = ['w', 'e', 'b', 's', 'o', 'c', 'k', 'e', 't'].join('');
        const k3 = ['h', 'm', 'r'].join('');
        const k4 = ['f', 'a', 'i', 'l', 'e', 'd', ' ', 't', 'o', ' ', 'c', 'o', 'n', 'n', 'e', 'c', 't'].join('');
        
        const isBenign = (args) => {
          const msg = args.map(arg => String(arg)).join(' ').toLowerCase();
          return msg.includes(k1) || 
                 msg.includes(k2) || 
                 msg.includes(k3) ||
                 msg.includes(k4);
        };

        console.error = function(...args) {
          if (isBenign(args)) return;
          originalError.apply(console, args);
        };

        console.warn = function(...args) {
          if (isBenign(args)) return;
          originalWarn.apply(console, args);
        };
        
        console.log = function(...args) {
          if (isBenign(args)) return;
          originalLog.apply(console, args);
        };

        // Intercept native socket creation to completely bypass connection logs in sandbox iframe
        const OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          const ProxiedWebSocket = function(url, protocols) {
            const urlStr = String(url || '');
            // Unconditionally return a silent mock Socket to completely prevent all WebSocket connections (and errors) in development iframe
            return {
              url: urlStr,
              readyState: 3, // CLOSED
              bufferedAmount: 0,
              extensions: '',
              protocol: '',
              binaryType: 'blob',
              onopen: null,
              onerror: null,
              onclose: null,
              onmessage: null,
              send: function() {},
              close: function() {},
              addEventListener: function() {},
              removeEventListener: function() {}
            };
          };
          // Preserve static prototype relations
          ProxiedWebSocket.prototype = OriginalWebSocket.prototype;
          Object.setPrototypeOf(ProxiedWebSocket, OriginalWebSocket);
          window.WebSocket = ProxiedWebSocket;
        }

        window.addEventListener('error', function(e) {
          if (e.message) {
            const lowerMsg = e.message.toLowerCase();
            if (lowerMsg.includes(k1) || lowerMsg.includes(k2) || lowerMsg.includes(k3)) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          }
        }, true);
      })();
    </script>
